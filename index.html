const seed=[
{id:1,author:'มินท์',av:'🌸',cat:'หนังสือ',title:'ฆาตกรรมบนรถด่วนโอเรียนท์',body:'นิยายสืบสวนคลาสสิกที่อ่านสนุกไม่มีเบื่อ หักมุมจนต้องกลับไปอ่านซ้ำ',img:'',likes:12,liked:false,cm:[{n:'บีม',t:'เล่มโปรดเลย!'}]},
{id:2,author:ANON,av:'🕵️',cat:'เกม',title:'Hollow Knight',body:'เกมแอ็กชันผจญภัยสุดสวยงาม เพลงดี โลกกว้าง เหมาะกับคนชอบความท้าทาย',img:'',likes:25,liked:false,cm:[]},
{id:3,author:'ต้น',av:'🚀',cat:'หนัง',title:'Interstellar',body:'หนังไซไฟที่ดูกี่ครั้งก็ยังน้ำตาซึม ดนตรีประกอบสุดยอด',img:'',likes:40,liked:false,cm:[{n:'มินท์',t:'ดูแล้วต้องดูอีก'}]}];
let S={posts:seed,name:'',anon:true,av:'😀',dark:matchMedia('(prefers-color-scheme:dark)').matches,nid:10},cat=null,qs='',open=new Set(),img='';
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grads=['#F9E6A8,#E8C872','#EADFC8,#F9E6A8','#C9BBA8,#F9E6A8'];
function theme(){document.documentElement.dataset.theme=S.dark?'dark':'light';$('#swD').classList.toggle('on',S.dark)}
function renderCats(){$('#cats').innerHTML=CATS.map(([n,e])=>`<button class="cat ${cat===n?'on':''}" data-cat="${n}"><span>${e}</span>${n}</button>`).join('')}
function render(a){
  const q=qs.trim().toLowerCase();
  const l=S.posts.filter(p=>(!cat||p.cat===cat)&&(!q||(p.title+p.body).toLowerCase().includes(q)));
  Promise.resolve().then(()=>syncC(a));$('#feed').className='feed'+(a?' a':'');$('#feed').innerHTML=l.length?l.map((p,i)=>{
    const ci=CATS.findIndex(c=>c[0]===p.cat),o=open.has(p.id);
    const media=p.img?`<img class="media" src="${esc(p.img)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'ph-img\\'>🖼️</div>'">`:`<div class="ph-img" style="background:linear-gradient(135deg,${grads[ci<0?0:ci]})">${CATS[ci<0?0:ci][1]}</div>`;
    return `<article class="post" data-c="${esc(p.cat)}" style="animation-delay:${Math.min(i,8)*70}ms"><div class="ph"><div class="av">${esc(p.av)}</div><div class="nm">${esc(p.author)}</div><span class="badge">${esc(p.cat)}</span></div>
    <div class="pb"><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></div>${media}
    <div class="act"><button class="${p.liked?'liked':''}" data-like="${p.id}" aria-label="Like"><span class="heart">${p.liked?'❤️':'🤍'}</span>${p.likes}</button><button data-cm="${p.id}">💬 ${p.cm.length}</button></div>
    <div class="cm ${o?'open':''}">${p.cm.map(c=>`<p class="c"><b>${esc(c.n)}</b>${esc(c.t)}</p>`).join('')}
    <div class="cf"><input id="ci${p.id}" placeholder="เขียนความคิดเห็น…" maxlength="200"><button class="btn" data-send="${p.id}">ส่ง</button></div></div></article>`}).join(''):'<div class="empty">ไม่พบโพสต์ 🔍</div>';
}
const who=()=>S.anon?{n:ANON,a:'🕵️'}:{n:S.name.trim()||'ผู้ใช้ wiw',a:S.av};
function show(id){$('#ov').classList.add('show');$(id).classList.add('show')}
function hide(){$('#ov').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'))}
function settings(){
  $('#avs').innerHTML=AVS.map(a=>`<button class="${S.av===a?'on':''}" data-av="${a}">${a}</button>`).join('');
  $('#sN').value=S.name;$('#swA').classList.toggle('on',S.anon);show('#shSet');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.ov');if(!t)return;
  if(t.dataset.cat){const r=t.getBoundingClientRect();openC(t.dataset.cat,r.left+r.width/2,r.top+r.height/2)}
  else if(t.dataset.ct){setC(t.dataset.ct)}
  else if(t.id==='cBack'){closeC()}
  else if(t.dataset.like){const p=S.posts.find(x=>x.id==t.dataset.like);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()}
  else if(t.dataset.cm){const id=+t.dataset.cm;open.has(id)?open.delete(id):open.add(id);const c=t.closest('.post').querySelector('.cm');c.classList.toggle('open',open.has(id));c.classList.add('tg')}
  else if(t.dataset.send){const id=+t.dataset.send,i=t.previousElementSibling,v=i.value.trim();if(!v)return;S.posts.find(x=>x.id===id).cm.push({n:who().n,t:v});open.add(id);save();render()}
  else if(t.dataset.av){S.av=t.dataset.av;save();settings()}
  else if(t.id==='swA'){S.anon=!S.anon;save();t.classList.toggle('on',S.anon)}
  else if(t.id==='swD'){S.dark=!S.dark;save();theme()}
  else if(t.id==='down'||t.id==='goFeed'){$('#s2').scrollIntoView({behavior:'smooth'})}
  else if(t.id==='fab'){if(vc)$('#nK').value=vc;show('#shNew')}
  else if(t.id==='bSet'||t.id==='bProf'){settings()}
  else if(t.id==='nGo'){
    const title=$('#nT').value.trim(),body=$('#nC').value.trim();
    if(!title||!body){alert('กรุณากรอกชื่อเรื่องและเนื้อหา');return}
    const w=who();
    S.posts.unshift({id:S.nid++,author:w.n,av:w.a,cat:$('#nK').value,title,body,img:img||$('#nU').value.trim(),likes:0,liked:false,cm:[]});
    save();['#nT','#nU','#nC','#nF'].forEach(s=>$(s).value='');img='';$('#fn').textContent='ยังไม่ได้เลือกไฟล์';$('#prev').style.display='none';
    hide();render(1);scrollTo({top:0})}
  else if(t.classList.contains('ov')||t.hasAttribute('data-close'))hide();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ci'))e.target.nextElementSibling.click();if(e.key==='Escape'){hide();closeC()}});
function go(s){$(s).scrollIntoView({behavior:'smooth',block:'start'})}
const KC={'หนังสือ':['b','📚'],'เกม':['g','🎮'],'หนัง':['m','🎬']};let vc=null;
function syncC(a){if(!vc)return;const f=$('#cfeed');f.className='feed'+(a?' a':'');const h=[...document.querySelectorAll('#feed .post')].filter(x=>x.dataset.c===vc).map(x=>x.outerHTML).join('');f.innerHTML=h||'<div class="empty">ยังไม่มีโพสต์ในหมวดนี้ ลองกด + เพื่อโพสต์</div>'}
function setC(k){vc=k;const cv=$('#cv');cv.dataset.k=KC[k][0];$('#ctw').innerHTML=`<h2 class="ct">${KC[k][1]} ${k}</h2>`;$('#ctabs').innerHTML=CATS.map(([n,e])=>`<button class="ctab ${n===k?'on':''}" data-ct="${n}">${e} ${n}</button>`).join('');syncC(1);cv.scrollTo({top:0,behavior:'smooth'})}
function openC(k,x,y){const cv=$('#cv');cv.style.setProperty('--ox',x+'px');cv.style.setProperty('--oy',y+'px');setC(k);cv.classList.add('show');document.body.style.overflow='hidden'}
function closeC(){$('#cv').classList.remove('show');document.body.style.overflow='';vc=null}
$('#q').addEventListener('input',e=>{qs=e.target.value;render(1)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur();go('#feed')}});
$('#sN').addEventListener('input',e=>{S.name=e.target.value;save()});
$('#nU').addEventListener('input',e=>{img='';const p=$('#prev');p.src=e.target.value;p.style.display=e.target.value?'block':'none'});
$('#nF').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;$('#fn').textContent=f.name;const r=new FileReader();r.onload=()=>{img=r.result;$('#prev').src=img;$('#prev').style.display='block'};r.readAsDataURL(f)});
new IntersectionObserver(es=>es.forEach(x=>x.target.classList.toggle('in',x.isIntersecting)),{threshold:.3}).observe($('#hero'));
theme();renderCats();render(1);requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('pre')));
</script>
</body>
</html>
